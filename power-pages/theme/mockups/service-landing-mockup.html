<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Envelopes — service dashboard (mockup)</title>
<style>
:root{--navy:#1e384b;--navy-dk:#0d2536;--burg:#6a0032;--teal:#036064;--line:#d5dbe0;--line-soft:#e6eaed;--ink:#33404a;--muted:#69727a;--page:#f4f6f8;--ok:#0c6b4f;--ok-bg:#e3f3ec;--warn-bg:#fff4d6;--warn-ink:#7a5600;--danger:#b3122b;--danger-bg:#fdecee}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
.shell{max-width:1170px;margin:0 auto;padding:0 15px}
.brand{background:#fff;border-bottom:1px solid var(--line-soft);padding:12px 0}.brand .logo{display:inline-flex;gap:10px;align-items:center;font-weight:800;color:var(--burg);font-size:20px}
.appbar{background:var(--navy);color:#fff}.appbar .in{display:flex;justify-content:space-between;align-items:center;padding:13px 0}
.appbar .right{display:flex;align-items:center;gap:16px}.bell{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.14)}.bell svg{width:20px;height:20px;fill:#fff}
.crumbs{padding:14px 0;font-size:13.5px;color:var(--muted)}.crumbs a{color:#174f84;text-decoration:none}
/* service context banner (1 level deep) */
.svcbanner{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--burg);border-radius:14px;padding:18px 22px;margin-top:6px}
.svcbanner .av{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--burg) 12%,#fff);color:var(--burg)}
.svcbanner .av svg{width:27px;height:27px;fill:currentColor}
.svcbanner h1{margin:0;font-size:24px;font-weight:800;color:var(--navy)}
.svcbanner p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.svcbanner .cta{margin-left:auto;display:flex;gap:10px}
.btn{appearance:none;font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--burg);color:var(--burg)}.btn.primary{background:var(--burg);border-color:var(--burg);color:#fff}.btn.primary:hover{filter:brightness(.9);color:#fff}
/* KPI filters */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;text-align:left;font:inherit}
.stat:hover{box-shadow:0 8px 20px rgba(0,0,0,.08)}
.stat.active{border-color:var(--burg);box-shadow:inset 4px 0 0 var(--burg)}
.stat .lab{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .lab::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted))}
.stat .num{font-size:28px;font-weight:800;color:var(--navy);margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.06);margin-top:18px;overflow:hidden}
.lst-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.lst-hd h4{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
.fs-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--navy)}.fs-btn:hover{border-color:var(--burg);color:var(--burg)}.fs-btn svg{width:18px;height:18px;fill:currentColor}
.lst-tools{display:flex;gap:12px;align-items:center;padding:14px 18px}.viewsel{border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-weight:600;color:var(--navy);font-size:13.5px}
.search{position:relative;margin-left:auto;flex:0 1 340px}.search input{width:100%;height:40px;border:2px solid #d7dce1;border-radius:10px;padding:0 14px 0 38px;font:inherit;font-size:14px}.search input:focus{outline:0;border-color:var(--burg);box-shadow:0 0 0 3px rgba(106,0,50,.12)}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:var(--muted)}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt thead th{background:var(--burg);color:#fff;text-align:left;font-weight:700;font-size:13px;padding:12px 16px;white-space:nowrap}
table.nt tbody td{padding:13px 16px;border-bottom:1px solid var(--line-soft)}table.nt tbody tr:hover{background:#fafbfc}
.s{color:var(--navy);font-weight:700}
.chip-svc{display:inline-block;font-size:12px;font-weight:600;color:#3d4a55;background:#eef2f5;border:1px solid #e0e6ea;border-radius:7px;padding:3px 9px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.draft{background:#eef1f3;color:#5f6b75}.pill.proc{background:var(--warn-bg);color:var(--warn-ink)}.pill.done{background:var(--ok-bg);color:var(--ok)}.pill.err{background:var(--danger-bg);color:var(--danger)}
.rowact{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-weight:800}
.pager{display:flex;gap:8px;justify-content:center;padding:16px}.pager button{min-width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;color:var(--navy)}.pager button.on{background:var(--burg);border-color:var(--burg);color:#fff}
.card.fs{position:fixed;inset:12px;z-index:9999;margin:0;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.fs-backdrop{display:none;position:fixed;inset:0;background:rgba(13,37,54,.45);z-index:9998}body.fs-on .fs-backdrop{display:block}
</style></head>
<body>
<div class="fs-backdrop" onclick="toggleFs(true)"></div>
<div class="brand"><div class="shell"><span class="logo">▟ Elections Canada</span></div></div>
<div class="appbar"><div class="shell in"><span>Electronic Signature Service</span><span class="right">👤 Frederick Pearson ▾ <span class="bell"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6v-5a7 7 0 0 0-5-6.7V4a2 2 0 1 0-4 0v.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg></span></span></div></div>

<div class="shell">
  <div class="crumbs"><a href="my-workspace-mockup.html">My Workspace</a> / Envelopes</div>
  <!-- one service level deep: banner + actions, then records -->
  <div class="svcbanner">
    <span class="av"><svg viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6Zm2 .4V18h16V6.4l-8 5-8-5Z"/></svg></span>
    <div><h1>Envelopes</h1><p>Create, send and track your electronic signature requests.</p></div>
    <div class="cta"><a class="btn" href="my-workspace-mockup.html">‹ Back to workspace</a><a class="btn primary" href="#">＋ New envelope</a></div>
  </div>

  <div class="stats">
    <button class="stat active" data-f="all" onclick="setFilter(this)"><div class="lab" style="--dot:var(--navy)">All</div><div class="num">12</div></button>
    <button class="stat" data-f="proc" onclick="setFilter(this)"><div class="lab" style="--dot:#c9862d">In process</div><div class="num">4</div></button>
    <button class="stat" data-f="done" onclick="setFilter(this)"><div class="lab" style="--dot:var(--ok)">Completed</div><div class="num">7</div></button>
    <button class="stat" data-f="err" onclick="setFilter(this)"><div class="lab" style="--dot:var(--danger)">Action required</div><div class="num">1</div></button>
  </div>

  <div class="card" id="envCard">
    <div class="lst-hd"><h4>Envelope records</h4><button class="fs-btn" title="Full screen" onclick="toggleFs()"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z"/></svg></button></div>
    <div class="lst-tools"><span class="viewsel">▤ Active envelopes ▾</span><div class="search"><svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.5 10.9l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg><input id="q" placeholder="Type to filter rows..." oninput="render()"></div></div>
    <table class="nt"><thead><tr><th></th><th>Envelope</th><th>Subject</th><th>Template</th><th>Signers</th><th>Status</th><th>Modified</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="pager" id="pager"></div>
  </div>
  <div style="height:40px"></div>
</div>
<script>
var DATA=[
 {n:"EN-2026-01845",s:"Consent to appointment",t:"Appointment Consent",sg:"3",st:"proc",stl:"In Process",m:"Sep 29, 11:12 a.m."},
 {n:"EN-2026-01844",s:"Auditor engagement letter",t:"Auditor Engagement",sg:"2",st:"proc",stl:"Ready to Send",m:"Sep 29, 09:40 a.m."},
 {n:"EN-2026-01840",s:"Nomination form — District 10002",t:"Nomination 2026",sg:"1",st:"err",stl:"Error",m:"Sep 28, 04:15 p.m."},
 {n:"EN-2026-01838",s:"Financial agent appointment",t:"Financial Agent",sg:"2",st:"proc",stl:"Preparing",m:"Sep 28, 02:01 p.m."},
 {n:"EN-2026-01835",s:"Party officer declaration",t:"Officer Declaration",sg:"1",st:"done",stl:"Completed",m:"Sep 27, 05:22 p.m."},
 {n:"EN-2026-01830",s:"Third party registration consent",t:"Third Party",sg:"2",st:"done",stl:"Completed",m:"Sep 27, 10:03 a.m."},
 {n:"EN-2026-01822",s:"EDA annual confirmation",t:"EDA Annual",sg:"1",st:"done",stl:"Completed",m:"Sep 26, 03:44 p.m."},
 {n:"EN-2026-01815",s:"Leadership contestant consent",t:"Leadership",sg:"3",st:"proc",stl:"In Process",m:"Sep 26, 08:19 a.m."},
 {n:"EN-2026-01808",s:"Candidate nomination — District 24019",t:"Nomination 2026",sg:"2",st:"done",stl:"Completed",m:"Sep 25, 01:30 p.m."},
 {n:"EN-2026-01801",s:"Registered party update",t:"Party Update",sg:"1",st:"done",stl:"Completed",m:"Sep 24, 11:11 a.m."},
 {n:"EN-2026-01790",s:"Consent to appointment (EDA)",t:"Appointment Consent",sg:"2",st:"done",stl:"Completed",m:"Sep 22, 04:55 p.m."},
 {n:"EN-2026-01781",s:"Auditor appointment (archived)",t:"Auditor Engagement",sg:"1",st:"done",stl:"Completed",m:"Sep 20, 09:02 a.m."}
];
var filter="all",page=1,PAGE=10;
function setFilter(el){document.querySelectorAll('.stat').forEach(s=>s.classList.remove('active'));el.classList.add('active');filter=el.dataset.f;page=1;render();}
function toggleFs(force){var c=document.getElementById('envCard');var on=force===true?false:!c.classList.contains('fs');c.classList.toggle('fs',on);document.body.classList.toggle('fs-on',on);}
function render(){var q=(document.getElementById('q').value||"").toLowerCase();
 var rows=DATA.filter(r=>(filter==="all"||r.st===filter)&&(!q||(r.n+r.s+r.t+r.stl).toLowerCase().includes(q)));
 var pages=Math.max(1,Math.ceil(rows.length/PAGE));if(page>pages)page=pages;var slice=rows.slice((page-1)*PAGE,page*PAGE);
 document.getElementById('rows').innerHTML=slice.length?slice.map(r=>`<tr><td><button class="rowact">⋯</button></td><td class="s">${r.n}</td><td>${r.s}</td><td><span class="chip-svc">${r.t}</span></td><td>${r.sg}</td><td><span class="pill ${r.st}">${r.stl}</span></td><td>${r.m}</td></tr>`).join(""):`<tr><td colspan="7" style="padding:40px;text-align:center;color:var(--muted)">No records.</td></tr>`;
 var pg=document.getElementById('pager');pg.innerHTML="";if(pages>1){for(var i=1;i<=pages;i++){var b=document.createElement('button');b.textContent=i;if(i===page)b.className="on";b.onclick=(function(x){return function(){page=x;render();}})(i);pg.appendChild(b);}var nx=document.createElement('button');nx.textContent="›";nx.onclick=function(){if(page<pages){page++;render();}};pg.appendChild(nx);}}
document.addEventListener('keydown',e=>{if(e.key==="Escape")toggleFs(true);});
render();
</script>
</body></html>
